<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>選手の追加</title>
</head>
<body>
  <h2>サッカー日本代表選手の追加</h2>
  <form action="/soccer" method="post">
    <table>
      <tr><th>項目</th><th>データ</th></tr>
      <tr><td>選手名</td><td><input name="name"></td></tr>
      <tr><td>ポジション</td><td><input name="position"></td></tr>
      <tr><td>背番号</td><td><input name="number"></td></tr>
      <tr><td>所属クラブ</td><td><input name="team"></td></tr>
      <tr><td>リーグ</td><td><input name="league"></td></tr>
    </table>
    <input type="submit" value="送信">
  </form>
  <a href="/soccer">選手一覧に戻る</a>
</body>
</html>
